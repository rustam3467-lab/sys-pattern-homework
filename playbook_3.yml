---
- name: Изменение системного приветствия (motd)
  hosts: all
  become: true
  vars:
    custom_motd: "Welcome to Rustam Rasulov's managed server! Authorized access only.\n"
  tasks:
    - name: Запись нового приветствия в файл /etc/motd
      ansible.builtin.copy:
        content: "{{ custom_motd }}"
        dest: /etc/motd
        mode: "0644"
